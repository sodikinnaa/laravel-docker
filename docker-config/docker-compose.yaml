volumes:
  # mariadb_data:
  mysql_data:


networks:
  baota_net:
    external: true

services:
  app:
    build:
      context: ..
      dockerfile: docker-config/config/docker/Dockerfile
    image: laravel-internal-sistem-app-prod
    container_name: laravel-app-prod
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
    ports:
      - "9000:9000"
      - "1022:22"
    networks:
      - baota_net

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx-prod
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../:/var/www/html
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - baota_net
    depends_on:
      - app

  mysql:
    image: mysql:8.1 # atau mysql:5.7 kalau mau versi lama
    container_name: laravel-mysql-prod
    restart: unless-stopped
    ports:
      - "13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistem_laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - baota_net
